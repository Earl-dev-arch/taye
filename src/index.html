<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About You — The 1975</title>
<link rel="icon" type="image/png" href="/src/assets/design.png">
<link rel="stylesheet" href="style.css">
oouuu shiiiii
</head>
<body>
<main class="app">
  <div class="grain"></div>
  <section class="hero">
    <div class="top"><span>Made by</span><span>Earl.DEV</span></div>
    
    <div class="cover-wrap">
      <img src="/src/assets/1975.png" alt="About You cover" id="cover" class="cover">
    </div>

    <div class="song-info">
      <h1>About You</h1>
      <p>The 1975</p>
    </div>
      
    <div class="lyrics-area">
      <div id="previous" class="lyric previous"></div>
      <div id="current" class="lyric current">Press play to start</div>
      <div id="next" class="lyric next"></div>
    </div>

    <div class="controls">
      <button id="playBtn" class="play">▶</button>
      <div class="progress-wrap">
        <div class="progress-track"><div id="progress" class="progress"></div></div>
        <div class="time"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
      </div>
    </div>
      
    <audio id="audio" preload="metadata">
      <source src="/src/assets/The 1975.mp3" type="audio/mpeg">
      //crushkita sobraa rica
    </audio>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
